<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言区</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.staticfile.org/twikoo/1.6.22/twikoo.all.min.js"></script>
</head>
<body>
  <header>
    <h1>留言区</h1>
    <nav>
      <a href="../index.html">主页</a>
      <a href="../works.html">作品集</a>
      <a href="twikoo.html">留言区</a>
    </nav>

  <main>
    <section id="tcomment"></section>
  </main>

  <footer>
    <p>感谢留言与支持</p>
  </footer>

  <div id="tcomment"></div>
<script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.min.js"></script>
<script>
twikoo.init({
  envId: 'https://twikoo222.netlify.app/.netlify/functions/twikoo', // 腾讯云环境填 envId；Vercel 环境填地址（https://xxx.vercel.app）
  el: '#tcomment', // 容器元素
  region: 'ap-guangzhou', // 环境地域，默认为 ap-shanghai，腾讯云环境填 ap-shanghai 或 ap-guangzhou；Vercel 环境不填
  path: location.pathname, // 用于区分不同文章的自定义 js 路径，如果您的文章路径不是 location.pathname，需传此参数
  lang: 'zh-CN', // 用于手动设定评论区语言，支持的语言列表 https://github.com/twikoojs/twikoo/blob/main/src/client/utils/i18n/index.js
})
</script>
</body>
</html>
